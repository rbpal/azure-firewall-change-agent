# Copies the files the agent's tools read into Blob storage on every push to
# main (ADR 0003). The tools read the copy, never GitHub.
#
# Sign-in uses no password or key. GitHub signs a token naming this repo and branch, and
# Azure accepts it only for main (federated credential fic-fwagentic-sync-main,
# built by infra/06-sync). The three IDs are stored as repo secrets. They do
# not let anyone sign in, but as secrets GitHub hides them in every log, and
# this repo's logs are public.
#
# Two snapshots are kept: the current one and the one before it. A manual run with
# rollback_to moves current.json back to a kept snapshot; it uploads and deletes
# nothing. docs/snapshots.md says how to compare snapshots and roll back.
name: sync-network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Full commit SHA of a kept snapshot to point current.json at; empty syncs this commit
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the signed token

# One sync at a time, in push order, so current.json never moves backwards.
concurrency:
  group: sync-network
  cancel-in-progress: false

env:
  ACCOUNT: stfwagentfuncdev
  CONTAINER: network-snapshot
  KEEP: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a rollback checks an older commit's file list

      # The input reaches the shell only as an environment variable, and is checked
      # before any use: a full SHA, a commit on main. Empty means sync this commit.
      - name: Choose the commit
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ -z "$ROLLBACK_TO" ]; then
            echo "TARGET=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_to must be a full commit SHA"; exit 1; }
            git merge-base --is-ancestor "$ROLLBACK_TO" HEAD || { echo "rollback_to is not a commit on main"; exit 1; }
            echo "TARGET=$ROLLBACK_TO" >> "$GITHUB_ENV"
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Files go into a folder named after the commit. Nothing reads it yet.
      - name: Upload this commit's files
        if: github.event_name == 'push' || inputs.rollback_to == ''
        run: |
          for dir in data/network infra/envs; do
            az storage blob upload-batch --auth-mode login --account-name "$ACCOUNT" \
              --destination "$CONTAINER" --destination-path "snapshots/$GITHUB_SHA/$dir" \
              --source "$dir" --overwrite --only-show-errors --output none
          done

      # The snapshot must hold exactly the commit's files before the pointer moves.
      - name: Check the snapshot is complete
        run: |
          git ls-tree -r --name-only "$TARGET" -- data/network infra/envs | sort > wanted.txt
          az storage blob list --auth-mode login --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" --prefix "snapshots/$TARGET/" --num-results "*" \
            --query "[].name" --output tsv | sed "s|^snapshots/$TARGET/||" | sort > uploaded.txt
          echo "commit $(wc -l < wanted.txt) files, snapshot $(wc -l < uploaded.txt)"
          diff wanted.txt uploaded.txt

      # Only now do the tools see the new commit. A tool reads current.json once per call.
      - name: Point current.json at the chosen commit
        run: |
          printf '{"commit": "%s"}\n' "$TARGET" > current.json
          az storage blob upload --auth-mode login --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" --name current.json --file current.json \
            --content-type application/json --overwrite --only-show-errors --output none

      # Keep the newest two; never delete the one current.json points at. A rollback deletes
      # nothing. There is no record of active runs, so no push may happen during a controlled run.
      - name: Delete old copies
        if: github.event_name == 'push' || inputs.rollback_to == ''
        run: |
          az storage blob list --auth-mode login --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" --prefix snapshots/ --num-results "*" \
            --query "[].[properties.lastModified, name]" --output tsv \
          | awk -F'\t' '{split($2, p, "/"); if (!(p[2] in t) || $1 > t[p[2]]) t[p[2]] = $1}
                        END {for (c in t) print t[c] "\t" c}' \
          | sort -r | tail -n +$((KEEP + 1)) | cut -f2 \
          | while read -r old; do
              [ "$old" = "$TARGET" ] && continue
              echo "deleting snapshots/$old/"
              az storage blob delete-batch --auth-mode login --account-name "$ACCOUNT" \
                --source "$CONTAINER" --pattern "snapshots/$old/*" --only-show-errors --output none
            done
