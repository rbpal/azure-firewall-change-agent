# Copies the files the agent's tools read into Blob storage on every push to
# main (ADR 0003), checks them byte for byte against Git, matches the agent
# version to this commit's instructions, deploys this commit's mcp/ code to the
# tool server and checks it answers that code's hash, then marks the commit
# ready for drafting. All three come from the same commit, in that order. The tools read the copy, never GitHub. Every push gets its own
# snapshot and marker, docs-only and test-only commits included, so any main
# commit can be drafted from.
#
# Ready for drafting is not applied in Azure. This workflow never changes a
# firewall policy: it writes only to the network-snapshot container, the
# drafter's agent versions and the tool server's code (Website Contributor on
# that one function app, granted in infra/05-func). workflow/deploy.py is the only code that publishes
# an agent version; it reuses the current one while the definition is unchanged.
#
# Sign-in uses no password or key. GitHub signs a token naming this repo and branch, and
# Azure accepts it only for main (federated credential fic-fwagentic-sync-main,
# built by infra/06-sync). The three IDs are stored as repo secrets. They do
# not let anyone sign in, but as secrets GitHub hides them in every log, and
# this repo's logs are public.
#
# Snapshots are immutable and kept until 24 hours after a newer commit replaced
# them, far longer than a draft may run (30 minutes). A manual run with
# rollback_to moves current.json back to a ready snapshot; it uploads and
# deletes nothing, and drafting still follows main.
name: sync-network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Full commit SHA of a kept snapshot to point current.json at; empty syncs this commit
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the signed token

# One sync at a time, in push order, so current.json never moves backwards.
concurrency:
  group: sync-network
  cancel-in-progress: false

env:
  ACCOUNT: stfwagentfuncdev
  CONTAINER: network-snapshot
  # The tool server's token audience (Terraform output mcp_api_identifier_uri in
  # infra/05-func). Set as a repo variable, so the job never needs Entra directory read.
  FWAGENT_MCP_AUDIENCE: ${{ vars.FWAGENT_MCP_AUDIENCE }}
  FWAGENT_FUNCTION_APP: func-fwagentic-dev
  FWAGENT_RESOURCE_GROUP: rg-fwagentic-dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a remote build and a cold Flex restart can take several minutes
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a rollback checks an older commit's file list

      # The input reaches the shell only as an environment variable, and is checked
      # before any use: a full SHA, a commit on main. Empty means sync this commit.
      - name: Choose the commit
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ -z "$ROLLBACK_TO" ]; then
            echo "TARGET=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_to must be a full commit SHA"; exit 1; }
            git merge-base --is-ancestor "$ROLLBACK_TO" HEAD || { echo "rollback_to is not a commit on main"; exit 1; }
            echo "TARGET=$ROLLBACK_TO" >> "$GITHUB_ENV"
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Upload once, check every file's bytes, reuse or publish the matching agent
      # version and read it back, deploy mcp/ if the server runs other code and
      # check its code hash, then write ready/<commit>.json. Any failure leaves no
      # marker, so drafting waits or stops; it never uses an older snapshot.
      - name: Mark this commit ready for drafting
        if: github.event_name == 'push' || inputs.rollback_to == ''
        env:
          FWAGENT_PROJECT_ENDPOINT: ${{ vars.FWAGENT_PROJECT_ENDPOINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run --python 3.11 python -m workflow.deploy ready --commit "$TARGET" --run-url "$RUN_URL"

      # A rollback only moves current.json, and only to a commit that is still ready
      # and whose recorded tool code the server still runs.
      - name: Check the rollback target is ready
        if: github.event_name != 'push' && inputs.rollback_to != ''
        run: uv run --python 3.11 python -m workflow.deploy check --commit "$TARGET"

      # Tools called without a pinned snapshot read the commit current.json names.
      - name: Point current.json at the chosen commit
        run: |
          printf '{"commit": "%s"}\n' "$TARGET" > current.json
          az storage blob upload --auth-mode login --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" --name current.json --file current.json \
            --content-type application/json --overwrite --only-show-errors --output none

      # Delete only snapshots another commit replaced more than 24 hours ago. A
      # draft may run 30 minutes at most, so no run outlives its snapshot.
      - name: Delete replaced snapshots
        if: github.event_name == 'push' || inputs.rollback_to == ''
        run: uv run --python 3.11 python -m workflow.deploy prune --keep "$TARGET"
