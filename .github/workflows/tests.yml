# Runs the whole test suite on every push and pull request, including the
# leak gate's own tests. Unlike a local hook, this cannot be skipped.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Terraform lets the estate test check `terraform fmt` instead of skipping it.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Run tests
        run: uv run --python 3.11 pytest -v
