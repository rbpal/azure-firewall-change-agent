[project]
name = "azure-firewall-change-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",  # lets jsonschema check "date-time"; without it the format is silently skipped
    "pyyaml>=6.0",
    "azure-ai-projects==2.8.0",
    "openai==3.26.1",
    "azure-identity>=1.17,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "python-hcl2>=8.1.4",
    "dnspython>=2.7,<3",  # dns_lookup_for_fqdn; the Function app gets it from mcp/requirements.txt
    "azure-storage-blob>=12.19,<13",  # BlobSource reads the snapshot container
    "azure-identity>=1.17,<2",  # BlobSource signs in with the managed identity
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
